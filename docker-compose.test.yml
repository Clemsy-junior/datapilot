# Overlay adding the end-to-end test runner.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     up --abort-on-container-exit --exit-code-from integration-tests
#
# The runner is a bare `python:3.12-slim` with the tests bind-mounted: the suite
# uses only the standard library, so there is nothing to install and nothing to
# download at test time. It talks to `http://frontend/api/...`, i.e. through
# nginx, which is what proves the browser → nginx → backend chain end to end.

services:
  integration-tests:
    image: python:3.12-slim
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./tests/integration:/tests:ro
    working_dir: /tests
    environment:
      DATAPILOT_BASE_URL: http://frontend
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "unittest", "discover", "-v"]
