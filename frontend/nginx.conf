# nginx serves the built SPA and proxies /api to the backend container.
#
# Why proxy instead of letting the browser call the API directly:
#   * the browser sees a single origin, so CORS is never involved in production;
#   * `backend` resolves through Docker Compose's internal DNS — the service
#     name is the hostname — which is exactly the pattern used behind a real
#     ingress or load balancer;
#   * TLS, rate limiting and access logs would all attach here, in one place.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset names are immutable; index.html must never be cached, or a
    # deploy leaves browsers pointing at assets that no longer exist.
    location /assets/ {
        # `expires` would set its own Cache-Control and win over add_header, so
        # the whole directive is written by hand instead.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Server-Sent Events. Without `proxy_buffering off` nginx accumulates the
    # response and the agent trace only appears once the run is over, which
    # defeats the entire point of streaming.
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # An agent turn can legitimately take a minute; do not cut it short.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }

    # Single-page application: any unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
